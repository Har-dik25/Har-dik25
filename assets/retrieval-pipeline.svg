<rect x="280" y="384" width="300" height="72" rx="12" fill="#0e1736" stroke="#2c3f82"/><rect x="294" y="384" width="272" height="2.5" rx="1.2" fill="#5eead4"/><text x="296.0" y="412.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Rank fusion</text><text x="296.0" y="434.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#b3c0e3" >reciprocal rank fusion with section boost</text>
<rect x="280" y="486" width="300" height="72" rx="12" fill="#0e1736" stroke="#2c3f82"/><rect x="294" y="486" width="272" height="2.5" rx="1.2" fill="#5eead4"/><text x="296.0" y="514.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Rerank</text><text x="296.0" y="536.0" text-anchor="start" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" font-weight="400" fill="#b3c0e3" >cross-encoder ms-marco-MiniLM-L-6-v2</text>
<rect x="280" y="588" width="300" height="72" rx="12" fill="#0e1736" stroke="#2c3f82"/><rect x="294" y="588" width="272" height="2.5" rx="1.2" fill="#ffb454"/><text x="296.0" y="616.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Synthesize</text><text x="296.0" y="638.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#b3c0e3" >extractive: quotes the statute text</text>
