<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 44" width="860" height="44" role="img" aria-labelledby="div-t div-d">
<title id="div-t">Section divider</title>
<desc id="div-d">An animated line with a pulsing isometric node at its centre and data packets flowing outward.</desc>

<style>
.tw{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.9}}
.dash{animation:dash 7s linear infinite}
.dash.fast{animation-duration:3s}
.dash.slow{animation-duration:13s}
.dash.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-160}}
.halo{animation:halo 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.95}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lift{animation:lift 5.2s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--a,-6px))}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4.2s ease-out infinite;opacity:0}
@keyframes ripple{0%{transform:scale(.25);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}
</style>

<defs><linearGradient id="dl" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="820" y2="0"><stop offset="0" stop-color="#52d6ff" stop-opacity="0"/><stop offset=".5" stop-color="#9a8cff"/><stop offset="1" stop-color="#52d6ff" stop-opacity="0"/></linearGradient><linearGradient id="gT-cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6f0ff"/><stop offset="1" stop-color="#52d6ff"/></linearGradient><linearGradient id="gL-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b9fd6"/><stop offset="1" stop-color="#1b6aa8"/></linearGradient><linearGradient id="gR-cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6aa8"/><stop offset="1" stop-color="#124a80"/></linearGradient><linearGradient id="gT-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3cbff"/><stop offset="1" stop-color="#9a8cff"/></linearGradient><linearGradient id="gL-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d5ae0"/><stop offset="1" stop-color="#4a3bb0"/></linearGradient><linearGradient id="gR-violet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3bb0"/><stop offset="1" stop-color="#33288a"/></linearGradient><linearGradient id="gT-mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4fbef"/><stop offset="1" stop-color="#5eead4"/></linearGradient><linearGradient id="gL-mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2fbfa4"/><stop offset="1" stop-color="#1f8a78"/></linearGradient><linearGradient id="gR-mint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f8a78"/><stop offset="1" stop-color="#166456"/></linearGradient><linearGradient id="gT-amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe3b3"/><stop offset="1" stop-color="#ffb454"/></linearGradient><linearGradient id="gL-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f09a2b"/><stop offset="1" stop-color="#b8691a"/></linearGradient><linearGradient id="gR-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8691a"/><stop offset="1" stop-color="#8a4c10"/></linearGradient></defs>
<line x1="40" y1="22" x2="820" y2="22" stroke="url(#dl)" stroke-width="1.5"/>
<g class="fx"><circle r="7.6" fill="#52d6ff" opacity=".18"/><g ><polygon points="-3.5,2.0 0.0,4.0 0.0,0.0 -3.5,-2.0" fill="url(#gL-cyan)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="3.5,2.0 0.0,4.0 0.0,0.0 3.5,-2.0" fill="url(#gR-cyan)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="0.0,-4.0 3.5,-2.0 0.0,0.0 -3.5,-2.0" fill="url(#gT-cyan)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/></g><animateMotion dur="5.0s" begin="-0.00s" repeatCount="indefinite" path="M430,22 L60,22"/></g>
<g class="fx"><circle r="7.6" fill="#5eead4" opacity=".18"/><g ><polygon points="-3.5,2.0 0.0,4.0 0.0,0.0 -3.5,-2.0" fill="url(#gL-mint)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="3.5,2.0 0.0,4.0 0.0,0.0 3.5,-2.0" fill="url(#gR-mint)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="0.0,-4.0 3.5,-2.0 0.0,0.0 -3.5,-2.0" fill="url(#gT-mint)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/></g><animateMotion dur="5.6s" begin="-1.30s" repeatCount="indefinite" path="M430,22 L800,22"/></g>
<g class="fx"><circle r="7.6" fill="#9a8cff" opacity=".18"/><g ><polygon points="-3.5,2.0 0.0,4.0 0.0,0.0 -3.5,-2.0" fill="url(#gL-violet)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="3.5,2.0 0.0,4.0 0.0,0.0 3.5,-2.0" fill="url(#gR-violet)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="0.0,-4.0 3.5,-2.0 0.0,0.0 -3.5,-2.0" fill="url(#gT-violet)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/></g><animateMotion dur="6.2s" begin="-2.60s" repeatCount="indefinite" path="M430,22 L60,22"/></g>
<g class="fx"><circle r="7.6" fill="#ffb454" opacity=".18"/><g ><polygon points="-3.5,2.0 0.0,4.0 0.0,0.0 -3.5,-2.0" fill="url(#gL-amber)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="3.5,2.0 0.0,4.0 0.0,0.0 3.5,-2.0" fill="url(#gR-amber)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/><polygon points="0.0,-4.0 3.5,-2.0 0.0,0.0 -3.5,-2.0" fill="url(#gT-amber)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round"/></g><animateMotion dur="6.8s" begin="-3.90s" repeatCount="indefinite" path="M430,22 L800,22"/></g>
<g class="bob" style="animation-duration:3s"><g ><polygon points="416.1,24.0 430.0,32.0 430.0,20.8 416.1,12.8" fill="url(#gL-violet)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" stroke-linejoin="round"/><polygon points="443.9,24.0 430.0,32.0 430.0,20.8 443.9,12.8" fill="url(#gR-violet)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" stroke-linejoin="round"/><polygon points="430.0,4.8 443.9,12.8 430.0,20.8 416.1,12.8" fill="url(#gT-violet)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.8" stroke-linejoin="round"/></g></g>
</svg>