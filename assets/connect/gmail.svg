<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 132" width="112" height="132" role="img" aria-labelledby="c-gmail-t c-gmail-d">
<title id="c-gmail-t">Email</title>
<desc id="c-gmail-d">Email icon button.</desc>

<style>
.tw{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.9}}
.dash{animation:dash 7s linear infinite}
.dash.fast{animation-duration:3s}
.dash.slow{animation-duration:13s}
.dash.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-160}}
.halo{animation:halo 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.95}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lift{animation:lift 5.2s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--a,-6px))}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4.2s ease-out infinite;opacity:0}
@keyframes ripple{0%{transform:scale(.25);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}

.cap{animation:cap 3.8s ease-in-out infinite}
@keyframes cap{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sh2{animation:sh2 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sh2{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(.86);opacity:.22}}
.glint{animation:glint 4.2s ease-in-out infinite}
@keyframes glint{0%,60%{transform:translateX(-90px)}100%{transform:translateX(110px)}}
</style>

<defs><linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1330"/><stop offset="1" stop-color="#070c1e"/></linearGradient><linearGradient id="kt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe6fb"/></linearGradient><linearGradient id="ks" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ea2e6"/><stop offset="1" stop-color="#6479c8"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="kc"><rect x="18" y="18" width="76" height="68" rx="16"/></clipPath></defs>
<rect width="112" height="132" rx="18" fill="url(#bgc)" stroke="#26376f"/>
<ellipse class="sh2" cx="56" cy="100" rx="34" ry="7" fill="#000"/>
<g class="cap">
<rect x="18" y="30" width="76" height="68" rx="16" fill="url(#ks)"/>
<rect x="18" y="18" width="76" height="68" rx="16" fill="url(#kt)"/>
<rect x="18.5" y="18.5" width="75" height="67" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
<svg x="37.0" y="31.0" width="38.0" height="38.0" viewBox="0 0 24 24" fill="#EA4335"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457"/></svg>
