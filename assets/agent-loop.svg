<text x="662.0" y="270.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#eef3ff" >Awaiting customer info</text>
<rect x="596" y="310" width="234" height="66" rx="12" fill="#0e1736" stroke="#ffb454" stroke-opacity=".85"/>
<text x="620.0" y="354.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="30" font-weight="700" fill="#ffb454" >4</text>
<text x="662.0" y="350.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#eef3ff" >Escalated to a human</text>
<text x="596.0" y="410.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="400" fill="#8c9dc9" >Documented run on 20 synthetic tickets;</text>
