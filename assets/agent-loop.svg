<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 524" width="860" height="524" role="img" aria-labelledby="agent-t agent-d">
<title id="agent-t">ShopWave support agent resolution loop</title>
<desc id="agent-d">A ticket is classified, resolved through a policy-gated chain of tools with retries, and ends as resolved, awaiting customer information or escalated to a human. Every step is written to an audit log.</desc>

<style>
.tw{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:.9}}
.dash{animation:dash 7s linear infinite}
.dash.fast{animation-duration:3s}
.dash.slow{animation-duration:13s}
.dash.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-160}}
.halo{animation:halo 3.4s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.45}50%{opacity:.95}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.bob{animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lift{animation:lift 5.2s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--a,-6px))}}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 4.2s ease-out infinite;opacity:0}
@keyframes ripple{0%{transform:scale(.25);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}
</style>

<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070c1c"/><stop offset="1" stop-color="#0b1330"/></linearGradient></defs><rect width="860" height="524" rx="16" fill="url(#bg)"/>
<defs><marker id="ah-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#52d6ff"/></marker><marker id="ah-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9a8cff"/></marker><marker id="ah-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#5eead4"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#ffb454"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#ff7a9c"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#7487bd"/></marker></defs>
<rect x="30" y="30" width="150" height="78" rx="12" fill="#0e1736" stroke="#2c3f82"/><rect x="44" y="30" width="122" height="2.5" rx="1.2" fill="#52d6ff"/><text x="46.0" y="58.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Ticket</text><text x="46.0" y="80.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#b3c0e3" >customer email</text>
