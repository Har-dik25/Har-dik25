<text x="252.0" y="58.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Classify</text>
<rect x="252" y="68" width="104" height="28" rx="14" fill="#0e1736" stroke="#52d6ff" stroke-opacity=".85"/><text x="304.0" y="86.6" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="400" fill="#eef3ff" >8 categories</text>
<rect x="364" y="68" width="195" height="28" rx="14" fill="#0e1736" stroke="#52d6ff" stroke-opacity=".85"/><text x="461.5" y="86.6" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="400" fill="#eef3ff" >urgency: low, medium, high</text>
<rect x="567" y="68" width="247" height="28" rx="14" fill="#0e1736" stroke="#52d6ff" stroke-opacity=".85"/><text x="690.5" y="86.6" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="12.5" font-weight="400" fill="#eef3ff" >flags: social engineering, threats</text>
<rect x="30" y="150" width="520" height="284" rx="12" fill="#0e1736" stroke="#2c3f82"/>
<rect x="44" y="150" width="492" height="2.5" rx="1.2" fill="#5eead4"/>
<text x="48.0" y="180.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="700" fill="#eef3ff" >Resolve with a tool chain</text>
<text x="48.0" y="201.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#b3c0e3" >every tool call retries up to 3 times with backoff and jitter</text>
<rect x="48" y="218" width="111" height="32" rx="16" fill="#0e1736" stroke="#5eead4" stroke-opacity=".85"/><text x="103.6" y="238.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >get_customer</text>
<text x="532.0" y="239.0" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#8c9dc9" >read</text>
<rect x="48" y="262" width="90" height="32" rx="16" fill="#0e1736" stroke="#5eead4" stroke-opacity=".85"/><text x="93.0" y="282.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >get_order</text>
<text x="532.0" y="283.0" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#8c9dc9" >read</text>
<rect x="48" y="306" width="196" height="32" rx="16" fill="#0e1736" stroke="#9a8cff" stroke-opacity=".85"/><text x="146.2" y="326.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >check_refund_eligibility</text>
<text x="532.0" y="327.0" text-anchor="end" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#8c9dc9" >policy gate</text>
<path d="M68,250 L68,262 M68,294 L68,306 M68,338 L68,354" stroke="#7487bd" stroke-width="1.5" marker-end="url(#ah-gray)" fill="none"/>
<rect x="48" y="360" width="111" height="32" rx="16" fill="#0e1736" stroke="#ffb454" stroke-opacity=".85"/><text x="103.6" y="380.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >issue_refund</text>
<rect x="167" y="360" width="97" height="32" rx="16" fill="#0e1736" stroke="#ffb454" stroke-opacity=".85"/><text x="215.7" y="380.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >send_reply</text>
<rect x="272" y="360" width="83" height="32" rx="16" fill="#0e1736" stroke="#ffb454" stroke-opacity=".85"/><text x="313.6" y="380.6" text-anchor="middle" font-family="'SF Mono','Cascadia Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="400" fill="#eef3ff" >escalate</text>
<text x="48.0" y="418.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#8c9dc9" >issue_refund is irreversible: blocked until eligibility passes, with</text>
<text x="48.0" y="438.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="13" font-weight="400" fill="#8c9dc9" >double-refund protection and amount validation</text>
<rect x="596" y="150" width="234" height="66" rx="12" fill="#0e1736" stroke="#5eead4" stroke-opacity=".85"/>
<text x="620.0" y="194.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="30" font-weight="700" fill="#5eead4" >12</text>
<text x="662.0" y="190.0" text-anchor="start" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="14.5" font-weight="400" fill="#eef3ff" >Resolved</text>
